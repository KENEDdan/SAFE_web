# Host-level reverse proxy for safe-ss.org.
# The app runs in Docker (see docker-compose.yml) published on 127.0.0.1:8006 —
# this just fronts it on 80/443. Install with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/safe-ss.org
#   sudo ln -s /etc/nginx/sites-available/safe-ss.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot --nginx to add the HTTPS server block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name safe-ss.org www.safe-ss.org;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
