{% extends "manage/console_base.html" %}
{% block title %}Delete project — Console{% endblock %}
{% block console %}
<h1>Delete project</h1>
<div class="card" style="max-width:520px;">
  <p>Delete <strong>{{ object.title }}</strong> and its photo gallery? This can't be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'content:manage_projects' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
